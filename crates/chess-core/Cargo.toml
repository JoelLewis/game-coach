[package]
name = "chess-core"
description = "Browser-side chess truth for GameCoach: legality, SAN/PGN, feature extraction, cp-loss classification"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
shakmaty = "0.27"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"

[dev-dependencies]
serde_json = "1"
